$mod = SUPER

# Keyboard layouts: English and Russian
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
}

monitor = DP-1, 2560x1440@164.835, 1920x0, 1
monitor = DP-2, 1920x1080@60, 0x0, 1

exec-once = awww-daemon
exec-once = sleep 1 && awww img ~/Pictures/Wallpapers/974def37a889f0b0707d65bf6d0fd62a.jpg --transition-type fade --transition-duration 2 --transition-fps 60
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = elephant
exec-once = walker --gapplication-service
# История буфера обмена: текст и изображения
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

$terminal = kitty
$fileManager = nautilus
$menu = walker

bind = $mod, RETURN, exec, $terminal
bind = $mod, Q, killactive
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $fileManager

# Переключение рабочего стола на мониторе под курсором
bind = $mod, 1, exec, hyprctl dispatch focusmonitor cursor && hyprctl dispatch workspace 1
bind = $mod, 2, exec, hyprctl dispatch focusmonitor cursor && hyprctl dispatch workspace 2
bind = $mod, 3, exec, hyprctl dispatch focusmonitor cursor && hyprctl dispatch workspace 3
bind = $mod, 4, exec, hyprctl dispatch focusmonitor cursor && hyprctl dispatch workspace 4
bind = $mod, 5, exec, hyprctl dispatch focusmonitor cursor && hyprctl dispatch workspace 5
bind = $mod, 6, exec, hyprctl dispatch focusmonitor cursor && hyprctl dispatch workspace 6
bind = $mod, 7, exec, hyprctl dispatch focusmonitor cursor && hyprctl dispatch workspace 7
bind = $mod, 8, exec, hyprctl dispatch focusmonitor cursor && hyprctl dispatch workspace 8
bind = $mod, 9, exec, hyprctl dispatch focusmonitor cursor && hyprctl dispatch workspace 9
bind = $mod, 0, exec, hyprctl dispatch focusmonitor cursor && hyprctl dispatch workspace 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, C, exit

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(a7c080ff) rgba(83c092ff) 45deg
    col.inactive_border = rgba(3c4841ff)
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 10
}

decoration {
    rounding = 12

    active_opacity = 0.96
    inactive_opacity = 0.90

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true

    bezier = smooth, 0.22, 1, 0.36, 1
    bezier = snappy, 0.3, 0, 0.7, 1

    animation = windows, 1, 4, smooth, popin 85%
    animation = windowsOut, 1, 3, snappy, popin 85%
    animation = border, 1, 8, smooth
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 5, smooth, slide
}

# Samsung Odyssey G5 — левый/основной монитор
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1, persistent:true
workspace = 4, monitor:DP-1, persistent:true
workspace = 5, monitor:DP-1, persistent:true

# BenQ BL2410 — второй монитор
workspace = 6, monitor:DP-2, default:true, persistent:true
workspace = 7, monitor:DP-2, persistent:true
workspace = 8, monitor:DP-2, persistent:true
workspace = 9, monitor:DP-2, persistent:true
workspace = 10, monitor:DP-2, persistent:true

bind = $mod, L, exec, hyprlock
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

dwindle {
    preserve_split = true
    smart_split = true
    force_split = 0
}

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# Скриншот выделенной области: Super + Shift + S
bind = SUPER SHIFT, S, exec, ~/.local/bin/screenshot

# Открыть историю буфера: Super + V
bind = SUPER, V, exec, cliphist list | walker --dmenu | cliphist decode | wl-copy
