general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/974def37a889f0b0707d65bf6d0fd62a.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.18
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(d3c6aaff)
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(a7c080ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(a7c080ff)
    inner_color = rgba(29,32,33,0.85)
    font_color = rgba(d3c6aaff)
    fade_on_empty = false
    rounding = 16
    placeholder_text = Password...
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
}
